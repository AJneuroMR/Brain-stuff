<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>दिमाग़ को हेल्दी कैसे रखें</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:#000;
    font-family:'Noto Sans Devanagari','Poppins',sans-serif;
    overscroll-behavior:none;
  }

  .stage{
    max-width:480px;
    margin:0 auto;
    height:100dvh;
    height:var(--vh, 100vh);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
    transition: background-color .55s ease;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:12px;
    padding: calc(16px + env(safe-area-inset-top)) 20px 12px;
    flex:0 0 auto;
    position:relative; z-index:5;
  }
  .progress-track{
    flex:1;
    height:5px;
    background:rgba(120,120,140,0.22);
    border-radius:6px;
    overflow:hidden;
    transition:background-color .4s ease;
  }
  .progress-fill{
    height:100%;
    width:8.33%;
    border-radius:6px;
    transition:width .45s cubic-bezier(.65,0,.35,1), background-color .45s ease;
  }
  .counter{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:.02em;
    min-width:38px;
    text-align:right;
    font-variant-numeric: tabular-nums;
    transition:color .4s ease;
  }

  /* ---------- viewport / track ---------- */
  .viewport{ flex:1 1 auto; overflow:hidden; position:relative; }
  .track{
    display:flex;
    height:100%;
    transition: transform .48s cubic-bezier(.65,0,.35,1);
    will-change:transform;
  }
  .track.dragging{ transition:none; }

  .card{
    flex:0 0 100%;
    height:100%;
    padding:2px 22px 8px;
    overflow-y:auto;
    scrollbar-width:none;
    color:var(--ink);
  }
  .card::-webkit-scrollbar{display:none;}

  .card-inner{
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding-bottom:14px;
  }

  .eyebrow{
    display:inline-flex;
    align-self:flex-start;
    align-items:center;
    gap:6px;
    font-family:'Poppins',sans-serif;
    font-size:20px;;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--accent-ink);
    background:var(--chipBg);
    border:1px solid var(--chipBorder);
    padding:6px 12px;
    border-radius:100px;
    margin-top:2px;
  }

  .illustration{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:14px 0 2px;
    min-height:128px;
  }
  .illustration svg{ width:100%; max-width:220px; height:auto; overflow:visible;
    filter: drop-shadow(0 10px 18px var(--shadowTint)); }

  .title{
    font-size: clamp(19px, 5.6vw, 23px);
    line-height:1.32;
    font-weight:800;
    margin:8px 0 0;
    letter-spacing:-0.01em;
  }
  .subtitle{
    font-family:'Poppins',sans-serif;
    font-size:14px;
    color:var(--accent-ink);
    font-weight:600;
    margin:8px 0 0;
  }

  .body{ margin-top:12px; font-size: clamp(14px,3.9vw,18px); line-height:1.7; color:var(--ink); }
  .body p{ margin:0 0 11px; opacity:.92; }
  .body p:last-child{ margin-bottom:0; }
  .body strong{ color:var(--accent-ink); font-weight:700; }

  .foodlist{ margin-top:14px; display:flex; font-size:18px; flex-direction:column; gap:9px; }
  .foodrow{
    display:flex; gap:10px; align-items:flex-start;
    background:var(--chipBg); border:1px solid var(--chipBorder);
    border-radius:16px; padding:10px 13px;
  }
  .foodrow .fdot{ width:7px; height:7px; border-radius:50%; background:var(--accent-ink); margin-top:7px; flex:0 0 auto; }
  .foodrow .ftext{ font-size:18px; line-height:1.55; }
  .foodrow .ftext b{ color:var(--accent-ink); }
  .foodrow .ftext span{ opacity:.75; font-size:18px; display:block; margin-top:1px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
  .chip{
    font-family:'Poppins',sans-serif;
    font-size:20px;
    font-weight:600;
    color:var(--ink);
    background:var(--chipBg);
    border:1px solid var(--chipBorder);
    padding:8px 13px;
    border-radius:100px;
    line-height:1.3;
  }

  .sources{ margin-top:auto; padding-top:16px; display:flex; flex-direction:column; gap:8px; }
  .source-chip{
    display:flex; align-items:flex-start; gap:8px;
    font-family:'Poppins',sans-serif;
    font-size:20px;;
    color:var(--sourceText);
    background:var(--sourceBg);
    border-radius:14px;
    padding:9px 11px;
    text-decoration:none;
    word-break:break-all;
    line-height:1.5;
  }
  .source-chip .dot{
    flex:0 0 auto; width:15px; height:15px; border-radius:50%;
    background:var(--accent-ink); color:var(--dotFg,#fff);
    display:flex; align-items:center; justify-content:center; font-size:8.5px; margin-top:1px;
  }
  .source-chip.no-link{ font-style:italic; }

  .note{
    font-family:'Poppins',sans-serif; font-size:18px;
    color:var(--sourceText); background:var(--sourceBg);
    border-radius:14px; padding:9px 12px; margin-top:12px; line-height:1.6;
  }

  /* ---------- bottom nav ---------- */
  .nav{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 20px calc(20px + env(safe-area-inset-bottom));
    gap:14px; position:relative; z-index:5;
  }
  .arrow-btn{
    width:46px; height:46px; border-radius:50%; border:none;
    background:var(--navBtnBg); color:var(--navBtnFg);
    font-size:19px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .3s ease, color .3s ease, transform .15s ease;
    flex:0 0 auto;
  }
  .arrow-btn:active{ transform:scale(0.9); }
  .arrow-btn.primary{ background:var(--accent-ink); color:var(--dotFg,#fff); }
  .arrow-btn:disabled{ opacity:.3; pointer-events:none; }
  .hint{ font-family:'Poppins',sans-serif; font-size:20px;; color:var(--navHint); letter-spacing:.03em; text-align:center; transition:color .4s ease; }

  /* ---------- hero (intro) ---------- */
  .hero-wrap{ position:relative; width:100%; height:clamp(150px,30vh,210px); margin:0 0 6px; }
  .hero-wrap svg{ width:100%; height:100%; overflow:visible; }

  /* ---------- keyframe library ---------- */
  @keyframes floatUp{ 0%{transform:translateY(0);opacity:0;} 15%{opacity:1;} 85%{opacity:1;} 100%{transform:translateY(-46px);opacity:0;} }
  @keyframes pulseRing{ 0%{transform:scale(.7);opacity:.55;} 100%{transform:scale(1.6);opacity:0;} }
  @keyframes softPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
  @keyframes twinkle{ 0%,100%{opacity:.25;} 50%{opacity:1;} }
  @keyframes heartbeat{ 0%,100%{stroke-dashoffset:0;} 50%{stroke-dashoffset:14;} }
  @keyframes breathe{ 0%,100%{transform:scale(0.86);opacity:.5;} 50%{transform:scale(1.12);opacity:.95;} }
  @keyframes scrollFeed{ 0%{transform:translateY(0);} 100%{transform:translateY(-40px);} }
  @keyframes scanline{ 0%{transform:translateY(-2px);opacity:0;} 10%{opacity:1;} 90%{opacity:1;} 100%{transform:translateY(112px);opacity:0;} }
  @keyframes shrinkGrow{ 0%,100%{transform:scale(1);} 50%{transform:scale(.82);} }
  @keyframes warnPulse{ 0%,100%{opacity:.15;transform:scale(1);} 50%{opacity:.4;transform:scale(1.12);} }
  @keyframes fadeIn{ from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  @keyframes nodePulse{ 0%,100%{opacity:.35; r:2.4;} 50%{opacity:1; r:3.6;} }
  @keyframes glowPulse{ 0%,100%{opacity:.5;} 50%{opacity:.9;} }
  @keyframes drift2{ 0%{opacity:0; transform:translateY(0);} 20%{opacity:.8;} 100%{opacity:0; transform:translateY(-14px);} }

  .p1{ animation:floatUp 3.2s ease-in-out infinite; }
  .p2{ animation:floatUp 3.2s ease-in-out infinite; animation-delay:1.05s; }
  .p3{ animation:floatUp 3.2s ease-in-out infinite; animation-delay:2.1s; }

  .ai-figure{ position:relative; }
  .ai-caption{ font-family:'Poppins',sans-serif; font-size:10.8px; color:var(--sourceText); text-align:center; margin-top:8px; line-height:1.5; }

  @media (max-height:700px){
    .hero-wrap{ height:130px; }
    .illustration{ min-height:96px; margin:8px 0 0; }
    .illustration svg{ max-width:160px; }
    .title{ margin-top:4px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
  }
</style>
</head>

  body:[
    'दिमाग़ में जो कुछ भी आँख से अंदर आता है, वो सबसे पहले perception (अनुभूति) की प्रक्रिया से गुज़रता है — visual cortex उसे प्रोसेस करता है और लगभग सीधा memory और belief-system तक पहुँचा देता है, बिना ज़्यादा सवाल किए। ये evolution की देन है: लाखों सालों तक जो आँख से दिखा वो असली ही होता था, तो दिमाग़ ने एक shortcut बना लिया — "देखा = सच"। इसे source-monitoring कहते हैं, यानी दिमाग़ ये track नहीं रखता कि जानकारी कहाँ से आई, बस उसे सच मान के आगे बढ़ जाता है — खासकर जब देखने में realistic लगे।',

function buildCard(c){
  const el = document.createElement('article');
  el.className = 'card';
  el.dataset.theme = c.theme;
  el.style.setProperty('--accent-ink', c.accent);

  let html = `<div class="card-inner">`;
  html += `<span class="eyebrow">${c.tag}</span>`;

  if(c.hero){
    html += `<div class="hero-wrap">${HERO_BRAIN}</div>`;
  } else if(c.image){
    html += `<div class="illustration ai-figure">
      <div style="position:relative; width:100%; border-radius:20px; overflow:hidden;">
        <img src="${IMG_SRC}" alt="असली बनाम AI डीपफेक तुलना" style="width:100%; display:block; border-radius:20px;">
        <div style="position:absolute; left:0; right:0; height:3px; background:linear-gradient(90deg, transparent, var(--accent-ink), transparent); animation:scanline 3s linear infinite; box-shadow:0 0 12px var(--accent-ink);"></div>
      </div>
    </div>
    <div class="ai-caption">असली (बाएं) बनाम AI डीपफेक (दाएं) — फ़र्क आँख से पकड़ना मुश्किल है</div>`;
  } else if(c.illus){
    html += `<div class="illustration">${c.illus}</div>`;
  }

  html += `<h1 class="title">${c.title}</h1>`;
  if(c.subtitle) html += `<div class="subtitle">${c.subtitle}</div>`;
  if(c.note) html += `<div class="note">${c.note}</div>`;

  if(c.body){
    html += `<div class="body">` + c.body.map(p=>`<p>${p}</p>`).join('') + `</div>`;
  }

  if(c.foodlist){
    html += `<div class="foodlist">` + c.foodlist.map(f=>`
      <div class="foodrow"><div class="fdot"></div>
        <div class="ftext"><b>${f.b}</b> ${f.ex} — ${f.benefit}</div>
      </div>`).join('') + `</div>`;
  }

  if(c.chips){
    html += `<div class="chips">` + c.chips.map(ch=>`<span class="chip">${ch}</span>`).join('') + `</div>`;
  }

  if(c.sources){
    html += `<div class="sources">` + c.sources.map(s=>{
      if(s.url){
        return `<a class="source-chip" href="${s.url}" target="_blank" rel="noopener">
          <span class="dot">↗</span><span class="url">${s.text}</span></a>`;
      }
      return `<div class="source-chip no-link"><span class="dot">📄</span><span class="url">${s.text}</span></div>`;
    }).join('') + `</div>`;
  }

  html += `</div>`;
  el.innerHTML = html;
  return el;
}

CARDS.forEach(c => track.appendChild(buildCard(c)));

let index = 0;
const total = CARDS.length;

function hexMix(bg2, theme){
  return theme === 'dark' ? '#000000' : '#000000';
}

function update(animate=true){
  if(!animate){ track.style.transition = 'none'; }
  track.style.transform = `translateX(-${index * 100}%)`;
  if(!animate){ requestAnimationFrame(()=>{ track.style.transition=''; }); }

  const c = CARDS[index];
  const isDark = c.theme === 'dark';

  stage.style.backgroundColor = c.bg[1];
  progressFill.style.background = c.accent;
  progressFill.style.width = `${((index+1)/total)*100}%`;
  counter.textContent = `${index+1}/${total}`;
  counter.style.color = isDark ? 'rgba(255,255,255,0.85)' : 'rgba(20,23,28,0.7)';
  hint.style.color = isDark ? 'rgba(255,255,255,0.55)' : 'rgba(20,23,28,0.45)';
  progressTrack.style.background = isDark ? 'rgba(255,255,255,0.18)' : 'rgba(20,23,28,0.10)';

  document.querySelectorAll('.card').forEach((el,i)=>{
    const cc = CARDS[i];
    const dark = cc.theme === 'dark';
    el.style.background = `linear-gradient(165deg, ${cc.bg[0]}, ${cc.bg[1]})`;
    el.style.setProperty('--ink', dark ? '#f5f6fa' : '#14171c');
    el.style.setProperty('--sub', dark ? '#b9bcc9' : '#5b6270');
    el.style.setProperty('--chipBg', dark ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.045)');
    el.style.setProperty('--chipBorder', dark ? 'rgba(255,255,255,0.20)' : 'rgba(0,0,0,0.12)');
    el.style.setProperty('--sourceBg', dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.04)');
    el.style.setProperty('--sourceText', dark ? '#d7d9e2' : '#5b6270');
    el.style.setProperty('--shadowTint', dark ? 'rgba(0,0,0,0.45)' : 'rgba(20,23,28,0.18)');
    el.style.setProperty('--dotFg', dark ? '#1a1a1a' : '#ffffff');
    el.style.setProperty('--navBtnBg', dark ? 'rgba(255,255,255,0.12)' : 'rgba(20,23,28,0.06)');
    el.style.setProperty('--navBtnFg', dark ? '#fff' : '#14171c');
  });

  nextBtn.style.background = c.accent;
  nextBtn.style.color = isDark ? '#1a1a1a' : '#ffffff';
  prevBtn.style.background = isDark ? 'rgba(255,255,255,0.14)' : 'rgba(20,23,28,0.06)';
  prevBtn.style.color = isDark ? '#fff' : '#14171c';

  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === total-1;
}

function go(delta){
  index = Math.max(0, Math.min(total-1, index + delta));
  update();
}

prevBtn.addEventListener('click', ()=>go(-1));
nextBtn.addEventListener('click', ()=>go(1));
document.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
});

/* ---------------- swipe handling ---------------- */
let startX = 0, currentX = 0, dragging = false;

track.addEventListener('pointerdown', e=>{
  dragging = true; startX = e.clientX; currentX = startX;
  track.classList.add('dragging');
  track.setPointerCapture(e.pointerId);
});
track.addEventListener('pointermove', e=>{
  if(!dragging) return;
  currentX = e.clientX;
  const delta = currentX - startX;
  const pct = (delta / track.clientWidth) * 100;
  track.style.transform = `translateX(calc(-${index*100}% + ${pct}%))`;
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  track.classList.remove('dragging');
  const delta = currentX - startX;
  const threshold = track.clientWidth * 0.16;
  if(delta < -threshold && index < total-1) index++;
  else if(delta > threshold && index > 0) index--;
  update();
}
track.addEventListener('pointerup', endDrag);
track.addEventListener('pointercancel', endDrag);
track.addEventListener('pointerleave', e=>{ if(dragging && e.buttons===0) endDrag(); });

function setVH(){ document.documentElement.style.setProperty('--vh', window.innerHeight+'px'); }
setVH();
window.addEventListener('resize', setVH);

update(false);
</script>
